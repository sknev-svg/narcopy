<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NARCOPY - Links</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="links">

  <header class="cabecalho">
    <div class="logo-narcopy">NARCOPY</div>
    <div class="cabecalho-acoes">
      <a class="btn-voltar" href="inicio.html">← Voltar</a>
      <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
  </header>

  <main class="conteudo">
    <div class="boas-vindas">
      <h1>🔗 Links</h1>
      <p>Seus links importantes, salvos localmente neste navegador (localStorage).</p>
    </div>

    <div class="painel-form">
      <h2>Novo link</h2>
      <!-- O formulário chama salvarLink() do app.js -->
      <form id="formLink">
        <div class="campo">
          <label for="campoNomeLink">Nome do link</label>
          <input type="text" id="campoNomeLink" placeholder="Ex: Google" required>
        </div>

        <div class="campo">
          <label for="campoUrlLink">Endereço do link</label>
          <input type="text" id="campoUrlLink" placeholder="Ex: https://www.google.com" required>
        </div>

        <button type="submit" class="btn">Salvar link</button>

        <div id="mensagemLink" class="mensagem"></div>
      </form>
    </div>

    <!-- Aqui o app.js insere os links salvos, via mostrarLinks() -->
    <div id="galeriaLinks" class="galeria">
      <p class="vazio">Carregando...</p>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
