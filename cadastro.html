<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NARCOPY - Criar acesso</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="cadastro">

  <div class="tela-central">
    <div class="caixa-login">
      <div class="logo-narcopy">NARCOPY</div>
      <div class="subtitulo">Criar novo acesso</div>

      <!-- O formulário chama a função criarAcesso() do app.js -->
      <form id="formCadastro">
        <div class="campo">
          <label for="campoUsuarioCadastro">Usuário</label>
          <input type="text" id="campoUsuarioCadastro" autocomplete="username" required>
        </div>

        <div class="campo">
          <label for="campoSenhaCadastro">Senha</label>
          <input type="password" id="campoSenhaCadastro" autocomplete="new-password" required>
        </div>

        <div class="campo">
          <label for="campoConfirmarSenha">Confirmar senha</label>
          <input type="password" id="campoConfirmarSenha" autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn">Criar acesso</button>

        <div id="mensagemCadastro" class="mensagem"></div>
      </form>

      <div class="link-embaixo">
        Já tem uma conta? <a href="index.html">Voltar para o login</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
