<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NARCOPY - Arquivos</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body data-pagina="arquivos">

  <header class="cabecalho">
    <div class="logo-narcopy">NARCOPY</div>
    <div class="cabecalho-acoes">
      <a class="btn-voltar" href="inicio.html">← Voltar</a>
      <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
  </header>

  <main class="conteudo">
    <div class="boas-vindas">
      <h1>📁 Arquivos</h1>
      <p>Seus arquivos são salvos localmente neste navegador (IndexedDB).</p>
    </div>

    <div class="painel-form">
      <h2>Adicionar novo arquivo</h2>
      <!-- O formulário chama salvarArquivo() do app.js -->
      <form id="formArquivo">
        <div class="campo">
          <label for="campoArquivo">Selecionar arquivo</label>
          <input type="file" id="campoArquivo" required>
        </div>

        <button type="submit" class="btn">Salvar arquivo</button>

        <div id="mensagemArquivo" class="mensagem"></div>
      </form>
    </div>

    <!-- Aqui o app.js insere os arquivos salvos, via mostrarArquivos() -->
    <div id="galeriaArquivos" class="galeria">
      <p class="vazio">Carregando...</p>
    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
